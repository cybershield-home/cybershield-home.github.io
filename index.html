<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cybershield</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Pasek górny (Navbar) -->
    <header class="navbar">
        <div class="logo" onclick="switchPage('home')">🛡️</div>
        <div class="menu-toggle" onclick="toggleMenu()">☰</div>
        <nav class="nav-links" id="navLinks">
            <a href="#" onclick="switchPage('home')">Strona główna</a>
            <a href="#" onclick="switchPage('warnings')">Ostrzeżenia</a>
            <a href="#" onclick="switchPage('programs')">Programy</a>
        </nav>
    </header>

    <!-- KONTENER NA STRONY UŻYTKOWNIKA -->
    <main class="container">
        
        <!-- Sekcja: Strona Główna -->
        <section id="page-home" class="page active">
            <h1>Strona główna</h1>
            <div id="home-content" class="grid-container">
                <!-- Tutaj pojawią się kafelki wiadomości -->
            </div>
        </section>

        <!-- Sekcja: Ostrzeżenia -->
        <section id="page-warnings" class="page">
            <h1>Ostrzeżenia</h1>
            <div id="warnings-content" class="grid-container">
                <!-- Tutaj pojawią się kafelki ostrzeżeń -->
                <p class="empty-msg" id="warn-empty">Nie ma ostrzeżeń</p>
            </div>
        </section>

        <!-- Sekcja: Programy -->
        <section id="page-programs" class="page">
            <h1>Programy</h1>
            <div id="programs-content" class="programs-list">
                <!-- Tutaj pojawią się pobrane pliki programów -->
                <p class="empty-msg" id="prog-empty">Na razie nie posiadamy programów</p>
            </div>
        </section>

        <!-- PANEL ADMINISTRATORA -->
        <section id="page-admin" class="page">
            <h1>Panel Administratora</h1>
            
            <!-- Okienko Logowania -->
            <div id="admin-login-box" class="card-login">
                <h3>Zaloguj się</h3>
                <input type="text" id="admin-user" placeholder="Login">
                <input type="password" id="admin-pass" placeholder="Hasło">
                <button onclick="handleLogin()">Zaloguj</button>
                <p id="login-error" style="color: red; display: none; margin-top: 10px; font-weight: bold;">Błędne dane logowania!</p>
            </div>

            <!-- Treść panelu po zalogowaniu -->
            <div id="admin-dashboard" style="display: none;">
                <div class="admin-tabs">
                    <button onclick="switchAdminTab('adm-home')">Dodaj na Główną</button>
                    <button onclick="switchAdminTab('adm-warnings')">Dodaj Ostrzeżenie</button>
                    <button onclick="switchAdminTab('adm-programs')">Dodaj Program</button>
                </div>

                <!-- Zakładka: Dodaj na Główną -->
                <div id="adm-tab-adm-home" class="admin-tab-content active-tab">
                    <h3>Dodaj kafelek na Stronę Główną</h3>
                    <input type="text" id="home-title" placeholder="Tytuł wiadomości">
                    <input type="text" id="home-cover" placeholder="Link do okładki (Direct URL z Postimages)">
                    <textarea id="home-text" placeholder="Treść wiadomości" rows="4"></textarea>
                    <button onclick="addHomeCard()">Dodaj kafelek</button>
                </div>

                <!-- Zakładka: Dodaj Ostrzeżenie -->
                <div id="adm-tab-adm-warnings" class="admin-tab-content">
                    <h3>Dodaj Ostrzeżenie</h3>
                    <input type="text" id="warn-title" placeholder="Tytuł ostrzeżenia">
                    <input type="text" id="warn-cover" placeholder="Link do okładki (Direct URL z Postimages)">
                    <textarea id="warn-text" placeholder="Treść ostrzeżenia" rows="4"></textarea>
                    <button onclick="addWarningCard()">Dodaj ostrzeżenie</button>
                </div>

                <!-- Zakładka: Dodaj Program -->
                <div id="adm-tab-adm-programs" class="admin-tab-content">
                    <h3>Dodaj Program</h3>
                    <input type="text" id="prog-name" placeholder="Nazwa programu">
                    <input type="file" id="prog-file">
                    <button onclick="addProgramItem()">Wgraj</button>
                </div>
            </div>
        </section>
    </main>

    <!-- Modal do wyświetlania pełnej treści wiadomości/ostrzeżeń -->
    <div id="modal" class="modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 id="modal-title"></h2>
            <div id="modal-body"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
