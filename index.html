<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cybershield</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Pasek górny (Navbar) -->
    <header class="navbar">
        <div class="logo" onclick="window.location.hash=''; checkUrlRoute();">🛡️</div>
        <div class="menu-toggle" onclick="toggleMenu()">☰</div>
        <nav class="nav-links" id="navLinks">
            <a href="#" onclick="window.location.hash=''; checkUrlRoute();">Strona główna</a>
            <a href="#/warnings" onclick="setTimeout(checkUrlRoute, 50);">Ostrzeżenia</a>
            <a href="#/programs" onclick="setTimeout(checkUrlRoute, 50);">Programy</a>
        </nav>
    </header>

    <main class="container">
        <!-- Strona Główna -->
        <section id="page-home" class="page">
            <h1>Strona główna</h1>
            <div id="home-content" class="grid-container"></div>
        </section>

        <!-- Ostrzeżenia -->
        <section id="page-warnings" class="page">
            <h1>Ostrzeżenia</h1>
            <div id="warnings-content" class="grid-container"></div>
        </section>

        <!-- Programy -->
        <section id="page-programs" class="page">
            <h1>Programy</h1>
            <div id="programs-content" class="programs-list"></div>
        </section>

        <!-- PANEL ADMINISTRATORA -->
        <section id="page-admin" class="page">
            <h1>Panel Administratora</h1>

            <div id="admin-login-box" class="card-login">
                <h3>Zaloguj się</h3>
                <input type="email" id="admin-user" placeholder="Adres e-mail administratora" autocomplete="username">
                <input type="password" id="admin-pass" placeholder="Hasło Supabase" autocomplete="current-password">
                <button onclick="handleLogin()">Zaloguj</button>
                <p id="login-error" style="color: red; display: none; margin-top: 10px; font-weight: bold;">Błąd logowania</p>
            </div>

            <div id="admin-dashboard" style="display: none;">
                <p>Jesteś zalogowany jako administrator.</p>
                <button onclick="handleLogout()">Wyloguj</button>
                <div class="admin-tabs">
                    <button onclick="switchAdminTab('adm-home')">Dodaj na Główną</button>
                    <button onclick="switchAdminTab('adm-warnings')">Dodaj Ostrzeżenie</button>
                    <button onclick="switchAdminTab('adm-programs')">Dodaj Program</button>
                </div>

                <div id="adm-tab-adm-home" class="admin-tab-content active-tab">
                    <h3>Dodaj kafelek na Stronę Główną</h3>
                    <input type="text" id="home-title" placeholder="Tytuł wiadomości">
                    <input type="text" id="home-cover" placeholder="Link do okładki">
                    <textarea id="home-text" placeholder="Treść wiadomości" rows="4"></textarea>
                    <button onclick="addHomeCard()">Dodaj kafelek</button>
                </div>

                <div id="adm-tab-adm-warnings" class="admin-tab-content">
                    <h3>Dodaj Ostrzeżenie</h3>
                    <input type="text" id="warn-title" placeholder="Tytuł ostrzeżenia">
                    <input type="text" id="warn-cover" placeholder="Link do okładki">
                    <textarea id="warn-text" placeholder="Treść ostrzeżenia" rows="4"></textarea>
                    <button onclick="addWarningCard()">Dodaj ostrzeżenie</button>
                </div>

                <div id="adm-tab-adm-programs" class="admin-tab-content">
                    <h3>Dodaj Program</h3>
                    <input type="text" id="prog-name" placeholder="Nazwa programu">
                    <input type="file" id="prog-file">
                    <button onclick="addProgramItem()">Wgraj</button>
                </div>
            </div>
        </section>
    </main>

    <!-- Modal Popup -->
    <div id="modal" class="modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 id="modal-title"></h2>
            <p id="modal-body"></p>
        </div>
    </div>

    <!-- Supabase client library; public project settings are configured in skrypt_nowy.js. -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="skrypt_nowy.js"></script>
</body>
</html>
